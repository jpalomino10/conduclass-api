docs:
  content: |-
    # Conduclass API

    API multi-tenant para gestión de autoescuelas.

    ## Flujos de autenticación

    ### Usuarios tenant (ADMIN / INSTRUCTOR / STUDENT)
    1. `POST /api/account/login` con `X-Tenant-ID` → guarda `access_token` + `refresh_token`
    2. `POST /api/account/refresh` → renueva `access_token`
    3. `POST /api/account/logout` → revoca `refresh_token`

    ### Superadmin (gestión de organizaciones)
    1. `POST /api/superadmin/login` → guarda `superadmin_token` + `superadmin_refresh_token`
    2. `POST /api/superadmin/refresh` → renueva `superadmin_token`

    ## Bases de datos
    - **Master DB**: organizaciones y superadmins
    - **Tenant DB**: usuarios, estudiantes, vehículos, horario (una por organización)
  type: text/markdown
bundled: false
