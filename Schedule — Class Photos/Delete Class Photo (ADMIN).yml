info:
  name: Delete Class Photo (ADMIN)
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/api/classes/{{class_id}}/photos/{{photo_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Elimina una foto de clase. Solo ADMIN.
