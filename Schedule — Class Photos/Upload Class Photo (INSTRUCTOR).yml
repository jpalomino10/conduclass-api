info:
  name: Upload Class Photo (INSTRUCTOR)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/classes/{{class_id}}/photos"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
      - name: caption
        type: text
        value: Descripción de la foto
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Registra una foto de clase tras subirla a S3. Solo INSTRUCTOR.
