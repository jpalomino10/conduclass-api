info:
  name: Change Password
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/account/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "current_password": "Admin123!",
        "new_password": "NewPass456!",
        "confirm_password": "NewPass456!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Cambia la contraseña del usuario autenticado.
