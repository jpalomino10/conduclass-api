info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/account/refresh"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
        //     pm.collectionVariables.set('access_token', body.access_token);
            test('Token renovado', () => expect(res.getStatus()).to.equal(200));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Renueva el `access_token` usando el `refresh_token` activo. Guarda automáticamente el nuevo token.
