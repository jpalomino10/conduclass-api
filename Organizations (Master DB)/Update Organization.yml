info:
  name: Update Organization
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/organization/{{org_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{superadmin_token}}
  body:
    type: json
    data: |-
      {
        "name": "Conduclass Demo Updated",
        "slug": "conduclass-demo",
        "active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Actualiza una organización.
