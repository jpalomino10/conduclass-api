info:
  name: Get Organization by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/organization/{{org_id}}"
  headers:
    - name: Authorization
      value: Bearer {{superadmin_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene una organización por ID.
