info:
  name: Create Organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/organization"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{superadmin_token}}
  body:
    type: json
    data: |-
      {
        "name": "Conduclass Demo",
        "slug": "conduclass-demo",
        "db_name": "conduclass_demo",
        "active": true,
        "plan": "FREE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
        //     pm.collectionVariables.set('org_id', body.id);
            test('Organización creada', () => expect(res.getStatus()).to.equal(200));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Crea una organización y provisiona su base de datos tenant automáticamente. Requiere token de superadmin.
