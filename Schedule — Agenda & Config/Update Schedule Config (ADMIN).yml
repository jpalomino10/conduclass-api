info:
  name: Update Schedule Config (ADMIN)
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/agenda/config"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "max_classes_per_day": 8,
        "class_duration_minutes": 60,
        "advance_booking_days": 30
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Actualiza la configuración del horario. Solo ADMIN.
