info:
  name: Get Weekly Schedule
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/agenda/weekly"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene el horario semanal de clases.
