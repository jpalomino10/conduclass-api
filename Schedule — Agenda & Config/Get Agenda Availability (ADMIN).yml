info:
  name: Get Agenda Availability (ADMIN)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/agenda/availability?date=2026-05-10&start_time=09:00:00&duration_minutes=60&category=B1"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  params:
    - name: date
      value: 2026-05-10
      type: query
    - name: start_time
      value: 09:00:00
      type: query
    - name: duration_minutes
      value: "60"
      type: query
    - name: category
      value: B1
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Consulta disponibilidad para agendar una clase en una fecha y hora específica. Solo ADMIN.
