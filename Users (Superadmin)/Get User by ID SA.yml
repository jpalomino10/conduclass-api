info:
  name: Get User by ID SA
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/user/sa/{{user_id}}"
  headers:
    - name: Authorization
      value: Bearer {{superadmin_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene un usuario por su ID. Requiere token de superadmin.