info:
  name: Get All Users SA
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/user/sa"
  params:
    - name: page
      value: "1"
      enabled: true
    - name: limit
      value: "10"
      enabled: true
    - name: search
      value: ""
      enabled: false
    - name: role
      value: ""
      enabled: false
  headers:
    - name: Authorization
      value: Bearer {{superadmin_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Lista usuarios con paginación. Filtros opcionales: search (nombre o email), role, page, limit."