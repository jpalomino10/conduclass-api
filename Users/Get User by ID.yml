info:
  name: Get User by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/user/{{user_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene un usuario por su ID.