info:
  name: Update User
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/user/{{user_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "name": "Juan Actualizado",
        "email": "instructor@tenant.com",
        "document": "1044422259",
        "role": "INSTRUCTOR",
        "active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Actualiza los datos de un usuario: nombre, email, documento, rol y estado activo."