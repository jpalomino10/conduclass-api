info:
  name: Get Class by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/classes/{{class_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene una clase por ID.
