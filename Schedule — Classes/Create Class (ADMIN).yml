info:
  name: Create Class (ADMIN)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/classes"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "instructor_id": "{{instructor_id}}",
        "student_id": "{{student_id}}",
        "vehicle_id": "{{vehicle_id}}",
        "scheduled_at": "2026-05-10T09:00:00Z",
        "duration_minutes": 60,
        "category": "B1"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
        //     pm.collectionVariables.set('class_id', body.id);
            test('Clase creada', () => expect(res.getStatus()).to.equal(200));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Crea una clase. Solo ADMIN.
