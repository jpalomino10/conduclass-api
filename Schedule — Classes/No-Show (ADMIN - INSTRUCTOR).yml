info:
  name: No-Show (ADMIN / INSTRUCTOR)
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/api/classes/{{class_id}}/no-show"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Marca la clase como no-show. ADMIN o INSTRUCTOR.
