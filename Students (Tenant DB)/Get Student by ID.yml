info:
  name: Get Student by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/students/{{student_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
        //     pm.collectionVariables.set('student_id', body.id);
            test('Estudiante obtenido', () => expect(res.getStatus()).to.equal(200));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene un estudiante por ID.
