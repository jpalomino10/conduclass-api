info:
  name: Create Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/students"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "user_id": "{{user_id}}",
        "license_category": "B1",
        "level": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Crea un estudiante asociado a un usuario del tenant.
