info:
  name: Get Superadmin by ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/superadmin/{{superadmin_id}}"
  headers:
    - name: Authorization
      value: Bearer {{superadmin_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene un superadmin por ID.
