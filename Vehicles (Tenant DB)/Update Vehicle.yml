info:
  name: Update Vehicle
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/vehicles/{{vehicle_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "plate": "ABC123",
        "brand": "Toyota",
        "model": "Corolla",
        "year": 2023,
        "category": "B1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Actualiza datos del vehículo.
