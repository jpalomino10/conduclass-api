info:
  name: Get Instructor Availability
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/instructors/{{instructor_id}}/availability"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Obtiene la disponibilidad del instructor.
