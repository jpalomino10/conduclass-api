info:
  name: Set Availability (ADMIN) — Reemplaza todo
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/instructors/{{instructor_id}}/availability"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "blocks": [
          {
            "day_of_week": 1,
            "start_time": "08:00:00",
            "end_time": "17:00:00"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Reemplaza toda la disponibilidad del instructor. Solo ADMIN.
