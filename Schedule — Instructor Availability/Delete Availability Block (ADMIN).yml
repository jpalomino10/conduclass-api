info:
  name: Delete Availability Block (ADMIN)
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}/api/instructors/{{instructor_id}}/availability/{{block_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Elimina un bloque de disponibilidad. Solo ADMIN.
