info:
  name: Create Availability Block (ADMIN)
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/instructors/{{instructor_id}}/availability/block"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: X-Tenant-ID
      value: "{{tenant_slug}}"
  body:
    type: json
    data: |-
      {
        "day_of_week": 3,
        "start_time": "08:00:00",
        "end_time": "12:00:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
        //     pm.collectionVariables.set('block_id', body.id);
            test('Bloque creado', () => expect(res.getStatus()).to.equal(200));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Agrega un bloque de disponibilidad. Solo ADMIN.
